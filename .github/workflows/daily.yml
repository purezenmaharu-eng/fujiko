name: Fujiko Daily Signal

on:
  schedule:
    - cron: '0 7 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-fujiko:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install yfinance pandas numpy requests jquants-api-client gspread google-auth google-generativeai lxml jpholiday

      - name: Check JP business day
        id: bizday
        run: |
          python - <<'EOF' >> "$GITHUB_OUTPUT"
          import datetime
          from zoneinfo import ZoneInfo
          import jpholiday

          today = datetime.datetime.now(ZoneInfo("Asia/Tokyo")).date()
          is_weekend = today.weekday() >= 5
          is_holiday = jpholiday.is_holiday(today)
          skip = is_weekend or is_holiday
          print(f"skip={'true' if skip else 'false'}")
          if skip:
              reason = "weekend" if is_weekend else jpholiday.is_holiday_name(today)
              print(f"::notice::{today} is not a JP business day ({reason}) - skipping run")
          EOF

      - name: Run Fujiko script (JP market)
        if: steps.bizday.outputs.skip != 'true'
        env:
          MARKET: JP
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
          RADIKABUNAVI_API_KEY: ${{ secrets.RADIKABUNAVI_API_KEY }}
          GOOGLE_SHEETS_CREDENTIALS: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GAS_URL: ${{ secrets.GAS_URL }}
          GAS_TOKEN: ${{ secrets.GAS_TOKEN }}
        run: |
          python fujiko.py

      - name: Run Fujiko script (US market)
        if: steps.bizday.outputs.skip != 'true'
        env:
          MARKET: US
          GOOGLE_SHEETS_CREDENTIALS: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GAS_URL: ${{ secrets.GAS_URL }}
          GAS_TOKEN: ${{ secrets.GAS_TOKEN }}
        run: |
          python fujiko.py
        
